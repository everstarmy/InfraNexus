<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Layers Icon -->
  <g filter="url(#shadow)" stroke="url(#layerGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Diamond -->
    <polygon points="32 14 50 23 32 32 14 23" fill="#ffffff" fill-opacity="0.12" />
    
    <!-- Middle Layer -->
    <polyline points="14 31 32 40 50 31" fill="none" />
    
    <!-- Bottom Layer -->
    <polyline points="14 39 32 48 50 39" fill="none" />
  </g>
</svg>

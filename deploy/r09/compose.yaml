# Disposable acceptance environment. Never point these services at deployment data.
name: infranexus-r09
x-app: &app
  build:
    context: ../..
    dockerfile: backend/Dockerfile
    args:
      GO_TAGS: r09audit
  image: infranexus-r09-app:local
  environment: &environment
    APP_APP_ENV: production
    APP_APP_DEBUG: "false"
    APP_DATABASE_DRIVER: postgres
    APP_DATABASE_POSTGRES_HOST: postgres
    APP_DATABASE_POSTGRES_USER: audit
    APP_DATABASE_POSTGRES_PASSWORD: ${R09_DB_PASSWORD:?run run.py to generate runtime secrets}
    APP_DATABASE_POSTGRES_DBNAME: audit
    APP_REDIS_HOST: redis
    APP_REDIS_POOL_SIZE: "8"
    APP_SECURITY_ENCRYPTION_KEY: ${R09_ENCRYPTION_KEY:?runtime secret required}
    APP_SECURITY_LOGIN_RATE_LIMIT: "1000"
    APP_JWT_SECRET: ${R09_JWT_SECRET:?runtime secret required}
    APP_LDAP_SCHEDULER_ENABLED: "false"
    INFRANEXUS_AUDIT_ADDR: ":9091"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  postgres:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_USER: audit
      POSTGRES_DB: audit
      POSTGRES_PASSWORD: ${R09_DB_PASSWORD:?runtime secret required}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${R09_REDIS_PORT:-16389}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  bootstrap:
    <<: *app
    command: ["bootstrap-admin"]
    environment:
      <<: *environment
      INFRANEXUS_BOOTSTRAP_ADMIN_PASSWORD: ${R09_ADMIN_PASSWORD:?runtime secret required}
  app:
    <<: *app
    ports:
      - "127.0.0.1:${R09_DIAGNOSTIC_PORT:-19091}:9091"
    stop_grace_period: 15s
    depends_on:
      bootstrap:
        condition: service_completed_successfully
  gateway:
    build:
      context: ../..
      dockerfile: deploy/r09/Dockerfile.gateway
    ports:
      - "127.0.0.1:${R09_HTTP_PORT:-18880}:8080"
      - "127.0.0.1:${R09_TIMEOUT_PORT:-18881}:8081"
      - "127.0.0.1:${R09_BLACKHOLE_PORT:-18882}:8082"
    depends_on:
      - app
  fault:
    build:
      context: ../..
      dockerfile: deploy/r09/Dockerfile.fault
    network_mode: service:gateway
    cap_add:
      - NET_ADMIN
    profiles: [audit]
